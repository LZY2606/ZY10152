<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BGP Lab — 策略仿真与决策追踪</title>
<style>
  :root {
    --bg:#0f141b; --panel:#161d27; --panel2:#1d2632; --line:#2a3543;
    --text:#e6ecf3; --muted:#8a97a8; --accent:#4ea1ff; --good:#3fbf7f;
    --warn:#e8b34a; --bad:#e5604d; --violet:#a98bff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:linear-gradient(180deg,#17202c,#121821); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  header .sub { color:var(--muted); font-size:12px; }
  select, button, input, textarea { background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-size:12px; }
  button { cursor:pointer; }
  button.primary { background:#23558f; border-color:#2f6db3; }
  button.primary:hover { background:#2b68ad; }
  button.ghost { background:transparent; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .layout { display:grid; grid-template-columns:250px 1fr 380px; gap:10px; padding:10px; height:calc(100vh - 51px); }
  .col { display:flex; flex-direction:column; gap:10px; min-height:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .card h2 { font-size:12px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .scroll { overflow:auto; min-height:0; }
  .scenario-item { padding:7px 9px; border:1px solid var(--line); border-radius:7px; margin-bottom:6px; cursor:pointer; }
  .scenario-item:hover { border-color:var(--accent); }
  .scenario-item.active { border-color:var(--accent); background:#1a2838; }
  .scenario-item .n { font-weight:600; }
  .scenario-item .meta { color:var(--muted); font-size:11px; margin-top:2px; word-break:break-all; }
  .badge { display:inline-block; padding:1px 7px; border-radius:99px; font-size:10.5px; font-weight:600; }
  .badge.stable { background:rgba(63,191,127,.15); color:var(--good); }
  .badge.oscillation { background:rgba(232,179,74,.15); color:var(--warn); }
  .badge.inconclusive { background:rgba(229,96,77,.15); color:var(--bad); }
  svg.topo { width:100%; height:340px; background:#0d1218; border-radius:8px; border:1px solid var(--line); }
  .node-rect { fill:#1c2836; stroke:#3d5066; stroke-width:1.2; }
  .node-rect.selected { stroke:var(--accent); stroke-width:2; }
  .node-rect.affected { stroke:var(--warn); }
  .node-label { fill:var(--text); font-size:12px; font-weight:600; text-anchor:middle; pointer-events:none; }
  .node-asn { fill:var(--muted); font-size:9.5px; text-anchor:middle; pointer-events:none; }
  .edge { stroke:#3a4a5e; stroke-width:1.3; fill:none; }
  .edge.best { stroke:var(--good); stroke-width:2.4; }
  .edge.affected { stroke:var(--warn); stroke-dasharray:5 3; }
  .edge-label { fill:var(--muted); font-size:9px; text-anchor:middle; }
  .tabs { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
  .tabs button { padding:4px 10px; font-size:11.5px; }
  .tabs button.on { background:#23364c; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  th,td { text-align:left; padding:4px 6px; border-bottom:1px solid #222c38; vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
  .pill { font-size:10px; padding:0 6px; border-radius:99px; }
  .pill.accept { background:rgba(63,191,127,.18); color:var(--good); }
  .pill.reject { background:rgba(229,96,77,.18); color:var(--bad); }
  .pill.continue { background:rgba(78,161,255,.15); color:var(--accent); }
  .pill.miss { background:#26313e; color:var(--muted); }
  .rule { border:1px solid var(--line); border-radius:7px; margin-bottom:6px; }
  .rule .head { display:flex; gap:8px; align-items:center; padding:6px 8px; cursor:pointer; }
  .rule .body { padding:0 8px 8px 26px; color:var(--muted); }
  .kv { display:grid; grid-template-columns:90px 1fr; gap:2px 8px; font-size:11.5px; }
  .kv b { color:var(--muted); font-weight:500; }
  .timeline-row { display:grid; grid-template-columns:34px 34px 1fr; gap:6px; padding:4px 6px; border-bottom:1px solid #202935;
    align-items:center; cursor:pointer; }
  .timeline-row:hover { background:#1a2430; }
  .timeline-row.on { background:#1d2d40; }
  .tk { color:var(--muted); font-size:10.5px; }
  .kind { font-size:9.5px; padding:1px 5px; border-radius:5px; background:#243140; text-align:center; }
  .tree { font-size:11.5px; }
  .tree ul { list-style:none; margin:0; padding-left:16px; border-left:1px dashed #324254; }
  .tree li { padding:2px 0; position:relative; }
  .muted { color:var(--muted); }
  .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); } .acc { color:var(--accent); } .vio { color:var(--violet); }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .spacer { flex:1; }
  pre.json { background:#0c1117; border:1px solid var(--line); border-radius:7px; padding:8px;
    max-height:230px; overflow:auto; font-size:10.5px; margin:6px 0 0; }
  .diff-add { color:var(--good); } .diff-del { color:var(--bad); }
  .toast { position:fixed; bottom:16px; right:16px; background:#1e2b3a; border:1px solid var(--accent);
    padding:9px 14px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:380px; }
  .toast.show { opacity:1; }
  .evidence { background:#241a18; border:1px solid #5a322b; color:#f0b5ab; border-radius:6px; padding:6px 8px; margin-top:5px; font-size:11px; }
  .stage { padding:3px 0; border-bottom:1px dotted #26313e; }
</style>
</head>
<body>
<header>
  <h1>BGP Lab</h1>
  <span class="sub">简化 BGP 策略 · 确定性收敛 · 逐条决策证据</span>
  <span class="spacer" style="flex:1"></span>
  <select id="scenarioSelect"></select>
  <button id="replayBtn" class="ghost">↻ 重放</button>
  <span id="fp" class="sub mono"></span>
</header>

<div class="layout">
  <!-- LEFT: scenarios + controls -->
  <div class="col">
    <div class="card scroll" style="flex:1">
      <h2>场景（快照分支）</h2>
      <div id="scenarioList"></div>
    </div>
    <div class="card">
      <h2>注入变更</h2>
      <div class="row" style="margin-bottom:6px">
        <select id="nodePick" style="flex:1"></select>
      </div>
      <div class="row">
        <button id="restartBtn">注入邻居重启</button>
        <button id="withdrawBtn">撤回首条通告</button>
      </div>
    </div>
  </div>

  <!-- CENTER: topology + timeline -->
  <div class="col">
    <div class="card">
      <div class="row">
        <h2 style="margin:0">拓扑</h2>
        <span class="spacer"></span>
        <select id="prefixPick"></select>
        <span id="statusBadge"></span>
      </div>
      <svg class="topo" id="topo" viewBox="0 0 760 420" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="row muted" style="margin-top:6px; font-size:11px">
        <span>绿线 = 该前缀当前最优路径</span><span>·</span>
        <span>黄框 = 预览受影响节点</span><span>·</span>
        <span>点击节点查看该节点决策</span>
      </div>
    </div>
    <div class="card scroll" style="flex:1">
      <div class="row">
        <h2 style="margin:0">稳定时间线</h2>
        <span class="spacer"></span>
        <span id="stepPos" class="muted"></span>
      </div>
      <div id="timeline" style="margin-top:6px"></div>
    </div>
  </div>

  <!-- RIGHT: decision + traces + editor -->
  <div class="col">
    <div class="card" style="flex:1" >
      <div class="tabs">
        <button data-tab="decision" class="on">决策树</button>
        <button data-tab="trace">规则追踪</button>
        <button data-tab="editor">策略编辑</button>
        <button data-tab="preview">预览/提交</button>
      </div>
      <div class="scroll" style="max-height:calc(100vh - 180px)">
        <div id="tab-decision"></div>
        <div id="tab-trace" style="display:none"></div>
        <div id="tab-editor" style="display:none"></div>
        <div id="tab-preview" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
