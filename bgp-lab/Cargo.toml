[package]
name = "bgp-lab"
version = "0.1.0"
edition = "2021"
description = "Deterministic simplified BGP policy lab: virtual event engine, decision traces and topology UI"
default-run = "bgp-lab"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
